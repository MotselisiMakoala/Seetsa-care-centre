<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alerts & reminders · Smarter-Book · Seetsa Health Centre</title><style>
:root{--bg:#eef3f4;--card:#fff;--ink:#15262b;--mut:#566a70;--pri:#0b7a85;--pri2:#e3f3f4;--ok:#1d8a4e;--bad:#c0392b;--line:#d5e0e2;--fs:16px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1d;--card:#182a2f;--ink:#e8f1f2;--mut:#a3b6bb;--pri:#3cc0cc;--pri2:#1b3a40;--ok:#35b872;--line:#2c444a;color-scheme:dark}}
*{box-sizing:border-box}html{font-size:var(--fs)}body.big{--fs:21px}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;line-height:1.4;padding-bottom:72px}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header a{color:#fff;text-decoration:none}header b{font-size:1.2rem}header small{display:block;font-size:.72rem;opacity:.9}
.tools button{background:#ffffff30;color:#fff;border:0;border-radius:18px;padding:8px 12px;font-size:.8rem;cursor:pointer;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:.72rem;color:var(--mut);text-decoration:none}nav a span{display:block;font-size:1.4rem}nav a.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
main{width:100%;max-width:1000px;margin:0 auto;padding:18px 16px;flex:1}
h1{font-size:1.6rem;margin:.2em 0 .5em}h2{font-size:1.15rem;margin:.2em 0}p{color:var(--mut);margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}.grid .card{margin:0}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--pri);color:#fff;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none;font-family:inherit}
.btn.alt{background:var(--pri2);color:var(--pri)}.btn.bad{background:none;color:var(--bad);border:2px solid var(--bad)}.btn.call{background:var(--ok)}.btn.w{background:var(--card);color:var(--ink);border:2px solid var(--line)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
.row{display:flex;gap:12px;align-items:center}.av{width:52px;height:52px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}.av.l{width:84px;height:84px;font-size:1.6rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:9px 14px;font-size:.9rem;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chip:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.tag{display:inline-block;font-size:.75rem;background:var(--pri2);color:var(--pri);padding:3px 9px;border-radius:10px;font-weight:700;margin-top:4px}
input,select{width:100%;padding:13px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem;margin:4px 0;font-family:inherit}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tog:last-child{border:0}
.tog input{width:46px;height:26px;appearance:none;background:var(--line);border-radius:13px;position:relative;cursor:pointer;margin:0;border:0}.tog input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tog input:checked{background:var(--ok)}.tog input:checked::after{left:23px}
.hero{background:var(--pri);color:#fff;border-radius:18px;padding:18px}.hero p{color:#e3f3f4}.hero .btn{background:#fff;color:var(--pri)}
.big-actions .btn{padding:26px;font-size:1.3rem}.ok{color:var(--ok)}.when{background:var(--pri2);color:var(--pri);padding:8px 12px;border-radius:8px;font-weight:700;margin:8px 0}
.split{display:grid;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr 1fr}.btn{width:auto;display:inline-block;min-width:200px;padding:14px 26px}.card .btn.full,.big-actions .btn{display:block;width:100%}}
@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}body{padding-bottom:0}nav{position:sticky;top:0;order:1;justify-content:center;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}nav a{flex:0 0 120px;font-size:.85rem}nav a span{display:inline;margin-right:6px;font-size:1rem}nav a.on{box-shadow:inset 0 -3px 0 var(--pri)}}
</style></head><body>
<header><a href="index.html"><b>Smarter-Book</b><small>Seetsa Health Centre</small></a><div class="tools"><button onclick="tb()" aria-label="Toggle larger text">A+ Larger text</button></div></header>
<nav aria-label="Main"><a href="index.html" class=""><span>⌂</span>Home</a><a href="doctors.html" class=""><span>✚</span>Doctors</a><a href="appointments.html" class=""><span>▣</span>Visits</a><a href="alerts.html" class="on" aria-current=page><span>✉</span>Alerts</a><a href="call.html" class=""><span>☎</span>Call us</a></nav><main><h1>Alerts &amp; reminders</h1><div class="split"><div class="card"><h2>🔔 Appointment tomorrow</h2><p>Dr. Mokoena · 10:30 · Seetsa Health Centre</p><div class="row"><button class="btn full" onclick="this.textContent='✓ Confirmed'">Confirm</button><a class="btn full alt" href="book.html">Reschedule</a></div></div>
<div class="card"><h2>How should we remind you?</h2><label class="tog">SMS message<input type="checkbox" checked></label><label class="tog">App notification<input type="checkbox" checked></label><label class="tog">Phone call (landline)<input type="checkbox"></label><label class="tog">1 day before<input type="checkbox" checked></label><label class="tog">2 hours before<input type="checkbox" checked></label></div></div></main><script>try{if(localStorage.getItem('sbBig')==='1')document.body.classList.add('big')}catch(e){}
function tb(){var b=document.body.classList.toggle('big');try{localStorage.setItem('sbBig',b?'1':'0')}catch(e){}}
function pick(g,b){document.querySelectorAll('[data-g='+g+']').forEach(function(x){x.classList.remove('on')});b.classList.add('on');window['sel_'+g]=b.dataset.v}
</script></body></html>
